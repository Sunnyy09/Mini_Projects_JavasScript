<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>BMI Calculator</h1>
    <form>
      <div class="h-div form-div">
        <label for="cm">Height in CM: </label>
        <input id="cm" type="text" name="cm" value="" />
      </div>
      <div class="w-div form-div">
        <label for="kg">Weight in KG: </label>
        <input id="kg" type="text" name="kg" value="" />
      </div>
      <button id="calculate">Calculate</button>
      <div id="result"></div>
    </form>
    <div class="guide">
      <p>Linear Weight => <strong>Less than 18.6</strong></p>
      <p>Normal Range => <strong>18.6 and 24.9</strong></p>
      <p>Overweight => <strong>Greater than 24.9</strong></p>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
